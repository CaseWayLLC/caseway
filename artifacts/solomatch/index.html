            "@type": "Question",
            "name": "Is Caseway free to use?",

              "@type": "Answer",
              "text": "Yes. Searching for and contacting attorneys on Caseway is completely free for people looking for legal help."
            }
          },
          {
            "@type": "Question",
            "name": "Does Caseway provide legal advice?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Caseway is a directory and discovery platform, not a law firm or lawyer referral service, and it does not provide legal advice. Always confirm an attorney's credentials and bar standing directly before hiring."
            }
          },
          {
            "@type": "Question",
            "name": "How can attorneys list their practice on Caseway?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Solo and independent attorneys can create a listing from the sign-up page. Listings are reviewed before they go live so clients searching in your area can find and contact you."
